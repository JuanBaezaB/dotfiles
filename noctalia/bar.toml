[bar.default]
thickness = 38
background_opacity = 0.92
widget_spacing = 8
padding = 12
hover_highlight = true
center = ["group:g1"]
end = ["media", "tray", "notifications", "clipboard", "group:g3", "widget", "session"]
start = ["launcher", "wallpaper", "workspaces", "group:g2"]

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_variant"
id = "g1"
members = ["clock", "date"]
opacity = 0.9
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_variant"
id = "g2"
members = ["cpu", "ram"]
opacity = 0.9
padding = 6.0

[[bar.default.capsule_group]]
accordion = true
accordion_direction = "end"
border = ""
enabled = true
fill = "surface_variant"
id = "g3"
members = ["control-center", "network", "bluetooth", "volume", "battery"]
opacity = 0.9
padding = 6.0
