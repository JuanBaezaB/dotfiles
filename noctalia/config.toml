[nightlight]
enabled = true
force = true
temperature_day = 4000
temperature_night = 4000

[plugins]
enabled = ["raycursive/niri-displays", "yuuto/arch-updater"]

[shell]
polkit_agent = true
font_family = "JetBrainsMono Nerd Font"
settings_show_advanced = false

[theme]
mode = "dark"
source = "custom"
custom_palette = "RosePineClassic"

[theme.templates]
builtin_ids = ["alacritty"]

[backdrop]
enabled = true
blur_intensity = 0.5
tint_intensity = 0.3

[wallpaper]
transition_on_startup = true

[wallpaper.automation]
enabled = true

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.sysmon]
stat = "ram_used"

[widget.wallpaper]
enabled = false

[widget.widget]
type = "yuuto/arch-updater:widget"
